services:
  novnc:
    image: fredblgr/ubuntu-novnc:20.04
    container_name: ${DOCKER_CONTAINER_NAME}
    restart: always
    #ports:
    #  - "16080:80"
    environment:
      - DISPLAY_WIDTH=1280
      - DISPLAY_HEIGHT=720
    volumes:
      - ~/git:/home/root/git:ro
      - ~/aia1:/home/root/aia1
    networks:
      - ai-agent-lab

networks:
  ai-agent-lab:
    external: true
    name: ai-agent-lab

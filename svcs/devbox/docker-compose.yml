services:

  devbox:
    image: devbox:latest
    container_name: devbox
    build:
      context: ../../
      dockerfile: svcs/devbox/Dockerfile.devbox
      args:
        - USER=${USER:-devbox}
        - UID=${UID:-1001}
        - GID=${GID:-1001}
    volumes:
      - ~/git:/workspace/git:ro
      - ~/aia1:/workspace/aia1
    working_dir: /workspace
    tty: true
    stdin_open: true
    environment:
      # Playwright Test will connect to the remote browser server
      - PW_TEST_CONNECT_WS_ENDPOINT=ws://playwright:3000/
    networks:
      - ai-agent-lab

networks:
  ai-agent-lab:
    external: true
    name: ai-agent-lab
